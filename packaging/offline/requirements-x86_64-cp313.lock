# Hash-pinned third-party wheels for the Debian 13 / x86_64 / CPython 3.13
# offline wheelhouse (tools/build_wheelhouse.py).
#
# The names and versions MUST equal runtime/pyproject.toml's `dependencies`
# (azazel-nexus itself is built from source, not downloaded); the library
# distribution declares none. tests/unit/test_offline_wheelhouse.py holds the
# two together. uv.lock is not used here because it does not cover the runtime
# distribution.
#
# Each hash is the one PyPI publishes for the single wheel file named in the
# comment above it. pip refuses any other file under --require-hashes.
