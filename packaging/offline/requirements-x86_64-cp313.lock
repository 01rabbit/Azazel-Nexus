# Hash-pinned third-party wheels for the Debian 13 / x86_64 / CPython 3.13
# offline wheelhouse (tools/build_wheelhouse.py).
#
# The names and versions MUST equal runtime/pyproject.toml's `dependencies`
# plus the library's bundled `fabric` and `mio` extras and their uv.lock
# resolves it (ADR-0004; azazel-nexus itself is built from source, not
# downloaded). tests/unit/test_offline_install_bundle.py holds them together,
# and tools/offline_bundle.py refuses at install any third-party wheel whose
# name, version and sha256 are not listed here, and any bundle that lacks one
# that is.
#
# Each PyPI hash is the one PyPI publishes (and uv.lock records) for the
# single wheel file named in the comment above it. pip refuses any other file
# under --require-hashes.
#
# azazel-fabric and azazel-mio have no published wheels. Their hashes are those
# of the wheels tools/build_wheelhouse.py builds from their pinned source
# commits (SOURCE_BUILDS) with the pinned backend, SOURCE_DATE_EPOCH and umask
# 022 fixed. The build is refused unless it reproduces the lock hash. The
# Fabric hash was observed on Debian 13 CPython 3.13.5, pip 25.1.1,
# setuptools 84.0.0, x86_64 (Rosetta) and aarch64 containers, 2026-10-28;
# MIO's current digest was reproduced with the repository builder on macOS
# arm64, CPython 3.12, pip 25.0.1 and setuptools 84.0.0; Debian CPython 3.13
# x86_64 and aarch64 reproduction remains to be confirmed.
#
