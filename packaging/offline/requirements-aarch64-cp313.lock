# Hash-pinned third-party wheels for the Debian 13 / aarch64 / CPython 3.13
# offline wheelhouse (tools/build_wheelhouse.py --target debian-13-aarch64-cp313).
#
# LAB TARGET. This lock serves the lab-software-verification platform profile
# (debian-13-arm64-cp313-lab, ADR-0003, ADR-0005). It is not a deployment
# baseline lock: ADR-0002 (Debian 13 / amd64) is unchanged, and a bundle,
# wheelhouse or install record made from this lock is VM software-integration
# evidence at most, never hardware-gate evidence or a production admission.
#
# The names and versions MUST equal the x86_64 lock's (and so the pyproject
# files' `dependencies` plus the bundled `fabric` and `mio` extras' uv.lock
# closure,
# ADR-0004); tests/unit/test_offline_arm_lab_target.py holds them together.
# Only the native wheels differ: pydantic-core and PyYAML carry the manylinux
# aarch64 cp313 file. Every other wheel is pure and pinned by the same hash
# as the x86_64 lock.
#
# Each PyPI hash is the one PyPI publishes for the single wheel file named in
# the comment above it (checked against https://pypi.org/pypi/<name>/<version>/json,
# 2026-10-29; pydantic-core's also equals uv.lock's). pip refuses any other file
# under --require-hashes.
#
# azazel-fabric and azazel-mio have no published wheel. Their hashes are those
# of the wheels tools/build_wheelhouse.py builds from their pinned source
# commits (SOURCE_BUILDS), exactly as for the x86_64 lock; each build is
# refused unless it reproduces this hash (Fabric's tag is also checked per
# ADR-0004).
#
