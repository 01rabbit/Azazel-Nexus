# Create the volatile overlay directory; preserve existing mode and ownership.
# No age/removal rule: journal-owned entries must survive controller failure.
d /run/systemd/system.control :0755 :root :root - -
# Create the activation controller's once-claim directory; never age or remove it.
d /run/azazel-nexus-bootstrap :0700 :root :root - -
# Root-owned identity handoff, independent of daemon RuntimeDirectory ownership.
d /run/azazel-mio-identity 0750 root azmio - -
