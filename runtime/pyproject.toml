[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azazel-nexus-runtime"
version = "0.0.1.dev0"
description = "AZ-07 Nexus: the OS service layer, separated from the library it serves"
readme = "README.md"
# 3.11 is the floor, and it is a capability rather than a preference:
# `tomllib` enters the standard library there, and it is the canonical
# reader for the `anchors.toml` a Knowledge Lite bundle is verified
# against (Nexus#67). Shipping a hand-written partial TOML parser to
# read the trust anchor of a signed artifact would trade a dependency
# for an attack surface.
requires-python = ">=3.11"

# `azazel-nexus` is the library this layer serves, and the dependency runs
# one way only. The library holds the state, contract, decision and audit
# models and imports nothing that can spawn a process, open a socket or touch
# host storage; this distribution is where all of that lives.
#
# The one transport dependency is pinned because activation calls the system
# bus through the fixed method table in `systemd_bus.py`. It receives no
# executable, unit, path, or signature from a caller. No process launcher or
# other transport dependency is present; the runtime boundary tests keep the
# privileged dependency direction one-way.
# The protected node.yaml reader uses SafeLoader with bounded/no-alias input,
# rather than a hand-written YAML parser. This stays out of the CORE library.
dependencies = ["azazel-nexus", "dbus-next==0.2.3", "PyYAML==6.0.3"]

[project.scripts]
az-nexus-model-admission = "azazel_nexus_runtime.model_admission_cli:main"
az-nexus-commission = "azazel_nexus_runtime.commission_cli:main"
az-nexus-bootstrap = "azazel_nexus_runtime.bootstrap_cli:main"
az-activation = "azazel_nexus_runtime.activation_cli:main"
az-commissiond = "azazel_nexus_runtime.commissiond:main"
az-activated = "azazel_nexus_runtime.activated:main"
az-auditd = "azazel_nexus_runtime.auditd:main"
az-auditd-loop = "azazel_nexus_runtime.auditd:main"
az-watchdog = "azazel_nexus_runtime.watchdog:main"
az-incident-explaind = "azazel_nexus_runtime.incident_explaind:main"
az-edge-intaked = "azazel_nexus_runtime.edge_intaked:main"
az-edge-probed = "azazel_nexus_runtime.edge_probed:main"
az-model-fetchd = "azazel_nexus_runtime.model_fetchd:main"
az-mio-identity = "azazel_nexus_runtime.model_identity:main"
az-mio-locald = "azazel_nexus_runtime.mio_locald:main"
az-mio-remoted = "azazel_nexus_runtime.mio_remoted:main"
az-mio-entryd = "azazel_nexus_runtime.mio_entryd:main"
az-mio-referenced = "azazel_nexus_runtime.mio_referenced:main"
az-knowledge-lited = "azazel_nexus_runtime.knowledge_lited:main"
az-decoy-netd = "azazel_nexus_runtime.decoy_netd:main"
az-decoyd = "azazel_nexus_runtime.decoyd:main"
az-core-reserve-probe = "azazel_nexus_runtime.core_reserve_probe:main"

az-hil-readiness = "azazel_nexus_runtime.hil_readiness:main"
az-hil-capture = "azazel_nexus_runtime.hil_capture:main"
az-nexus-noc = "azazel_nexus_runtime.noc_observe:main"
az-units-observe = "azazel_nexus_runtime.units_observe:main"
az-noc-observe = "azazel_nexus_runtime.noc_snapshot:main"
az-ui = "azazel_nexus_runtime.ui_serve:main"

[tool.setuptools.packages.find]
where = ["src"]

# The read-only UI's static files (az-ui): served from memory, never by a path
# taken from a request.
[tool.setuptools.package-data]
azazel_nexus_runtime = ["ui_static/*.html", "ui_static/*.css", "ui_static/*.js", "ui_static/*.json"]
