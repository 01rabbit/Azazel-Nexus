[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azazel-nexus"
version = "0.0.1.dev0"
description = "AZ-07 Nexus Gateway: integrated node runtime"
readme = "README.md"
# 3.11 is the floor, and it is a capability rather than a preference:
# `tomllib` enters the standard library there, and it is the canonical
# reader for the `anchors.toml` a Knowledge Lite bundle is verified
# against (Nexus#67). Shipping a hand-written partial TOML parser to
# read the trust anchor of a signed artifact would trade a dependency
# for an attack surface.
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Deliberately empty.
#
# Nexus must be useful as CORE with no external Knowledge, no Deception, no
# remote cognition and no cloud connectivity. A dependency added here is a
# dependency the CORE path can fail on, so the bootstrap carries none and a
# later addition has to justify itself against that sentence.
dependencies = []

# The operator's entry point. It needs nothing installed beyond the package
# itself, which is the point: a status command that depends on an extra is
# unavailable exactly when an operator needs it to explain what is missing.
[project.scripts]
azazel-nexus = "azazel_nexus.cli:main"

[project.optional-dependencies]
# PyNaCl is here and **only** here. `dependencies = []` above is about what a
# node needs to verify its own cache with no wheel available; it says nothing
# about what a test needs. The differential test against libsodium
# (`tests/unit/test_signature_differential.py`, Nexus#70) is the one thing
# that can say the hand-written verifier agrees with an established
# implementation, and a differential test that cannot be run is one nobody
# runs.
dev = ["pytest>=8", "pynacl>=1.5"]

# Optional, never required. Nexus must be useful as CORE with no external
# Knowledge, no Deception, no remote cognition and no cloud connectivity, so
# Fabric cannot enter `dependencies` above -- a CORE path that fails when a
# contract library is missing is not a CORE path. Fabric uses an exact tag,
# never a branch or development commit (ADR-0001).
fabric = ["azazel-fabric @ git+https://github.com/01rabbit/Azazel-Fabric.git@v0.10.0"]

# Optional shared M.I.O. core for the complete runtime distribution. Keep it
# out of CORE dependencies; the offline bundle builds this exact source commit.
mio = ["azazel-mio @ git+https://github.com/01rabbit/Azazel-MIO.git@8751c60046b500dcdffda0154e75ab9f05225a41"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that blocks prints every thread's stack after five minutes instead
# of hanging a CI job silently until the runner's own limit.
faulthandler_timeout = 300
# Two kinds of evidence, declared rather than incidental (Nexus#114).
#
# `real_process` starts an actual process and observes what it does.
# `injected` sets a state and checks what follows from it.
#
# They are not interchangeable, and #112 conflated them: its `crashed` state
# was injected, and calling that process evidence is the confusion #114
# exists to remove. Registering the marks means the two sets can be selected
# and counted separately -- `pytest -m real_process` is the process evidence,
# and nothing else is.
markers = [
    "real_process: starts a real process and observes it",
    "injected: sets a state; claims nothing about a real process",
]
