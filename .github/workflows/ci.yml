name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what pyproject.toml declares. This is
        # the CI runner's matrix, not a product support claim -- Nexus declares
        # no supported runtime of its own (docs/support-matrix.md §7).
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      # Installed as its own distribution, which is the claim being made: the
      # privileged layer is separable, and the library above was installed
      # without it.
      - name: Install the runtime distribution
        run: python -m pip install -e ./runtime

      # The hosted runner is a non-root identity. Run the CORE/Lite composition
      # explicitly here as well as in the full suite so a later runner-image
      # change cannot silently make this half of Nexus#56 disappear.
      - name: Prove CORE + Lite integration as non-root
        run: |
          python - <<'PY'
          import os
          if os.geteuid() == 0:
              raise SystemExit("the runner unexpectedly executes as root")
          PY
          PYTHONDONTWRITEBYTECODE=1 python -m pytest \
            -p no:cacheprovider tests/unit/test_core_lite_integration.py -q

      # Two tests execute packaging/install.sh on the host. The installer
      # deliberately refuses any host that is not a reviewed install profile
      # (Debian 13 only), so they cannot pass on ubuntu-latest. They run in
      # the `installer-debian13` job instead.
      - name: Run unit tests
        run: |
          python -m pytest tests/unit -q \
            --deselect tests/unit/test_bootstrap_tmpfiles_packaging.py::test_staged_install_copies_rule_without_running_tmpfiles \
            --deselect tests/unit/test_e2e_harness.py::test_the_installer_runs_and_creates_the_declared_layout

      # The benchmark harnesses carry their own tests (fixtures, scoring and the
      # contract with the advisory reader). They are not under tests/unit, so
      # without this step a reader change could break them unnoticed, which
      # happened once (bench/mio_local after the 1a guardrails).
      - name: Run benchmark harness tests
        run: python -m pytest bench -q -p no:cacheprovider

      # The TLS, mTLS and pinning tests are the ones most worth running and
      # the ones that used to be most likely not to: an earlier version
      # generated a certificate with the `openssl` CLI and skipped when the
      # binary was absent, so the binary's presence was a precondition of the
      # checks it was hiding behind. The fixtures are committed now and
      # nothing here needs a CLI -- and this step is what says so, rather
      # than a reader counting dots.
      #
      # A skip fails the job. So does a run that collected fewer cases than
      # the floor, because deleting the file's contents would otherwise be a
      # green run.
      - name: Refuse a silent skip of the TLS tests
        run: |
          python -m pytest tests/unit/test_artifact_egress.py \
            tests/unit/test_tls_fixture_hygiene.py -q \
            | tee /tmp/tls.txt
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("/tmp/tls.txt").read_text()
          if "skipped" in text or "no tests ran" in text:
              sys.exit(
                  "a TLS test skipped or did not run. These are the checks "
                  "that must not depend on what happens to be installed"
              )
          match = re.search(r"(\d+) passed", text)
          if not match:
              sys.exit("the TLS tests reported no passes")
          if int(match.group(1)) < 60:
              sys.exit(f"only {match.group(1)} TLS cases ran")
          print(f"{match.group(1)} TLS cases ran, none skipped")
          PY

      # The differential test against libsodium is the one thing that can say
      # the hand-written Ed25519 verifier agrees with an established
      # implementation (Nexus#70). It skips when PyNaCl is absent, so that a
      # contributor without the dev extra is not blocked -- and a skip here
      # would be the whole check quietly not running. The run above would
      # still be green.
      - name: Refuse a silent skip of the differential crypto test
        run: |
          python -m pytest tests/unit/test_signature_differential.py -q \
            | tee /tmp/differential.txt
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("/tmp/differential.txt").read_text()
          if "skipped" in text:
              sys.exit("the differential crypto test skipped; PyNaCl is not installed")
          match = re.search(r"(\d+) passed", text)
          if not match:
              sys.exit("the differential crypto test reported no passes")
          # A floor, so that deleting the file's contents is not a green run.
          if int(match.group(1)) < 50:
              sys.exit(f"only {match.group(1)} differential cases ran")
          print(f"{match.group(1)} differential cases agreed with libsodium")
          PY

  # The installer accepts only the debian-13-systemd-installer-v1 platform
  # profile, so the root harness runs in a Debian 13 container (as root).
  integration-as-root:
    name: Install-to-status integration as root (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Debian packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git ca-certificates \
            coreutils findutils passwd util-linux \
            build-essential python3-dev libffi-dev

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test and runtime distributions into a venv
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/python -m pip install --upgrade pip
          # Non-editable: the staged entrypoint check runs Python -IS and
          # deliberately ignores .pth files, so an editable finder is invisible.
          /opt/venv/bin/python -m pip install '.[dev]'
          /opt/venv/bin/python -m pip install ./runtime

      - name: Run CORE + Lite integration suite as root
        run: |
          /opt/venv/bin/python -c \
            'import os; assert os.geteuid() == 0, "the container is not root"'
          PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$PWD/src:$PWD/runtime/src" \
            /opt/venv/bin/python -m pytest -p no:cacheprovider \
            tests/unit/test_core_lite_integration.py -q

      # The complete harness includes the real install-accounts stage, which
      # creates system accounts in this disposable container. Keep generated
      # files outside the checkout and disable bytecode before running it.
      - name: Run install-to-status harness as root
        run: |
          /opt/venv/bin/python -c \
            'import os; assert os.geteuid() == 0, "the container is not root"'
          e2e_root="$(mktemp -d /tmp/az-e2e-root.XXXXXX)"
          report="$(mktemp /tmp/az-e2e-root-report.XXXXXX)"
          PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$PWD/src:$PWD/runtime/src" \
            /opt/venv/bin/python tools/e2e.py --root "$e2e_root" --report "$report"
          REPORT_PATH="$report" /opt/venv/bin/python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          if os.geteuid() != 0:
              sys.exit("the report check unexpectedly executes as non-root")
          text = pathlib.Path(os.environ["REPORT_PATH"]).read_text()
          for stage in ("install accounts", "CORE + Lite configurations",
                        "Knowledge Lite trust enrollment",
                        "Knowledge Lite import, repin, revocation and audit stop"):
              if not re.search(r"^ok\s+" + re.escape(stage) + r"\s+\(", text, re.M):
                  sys.exit(f"root harness did not execute required stage: {stage}")
          if re.search(r"^FAILED\s", text, re.M):
              sys.exit("the root harness report contains a failed stage")
          print("root harness executed install accounts, CORE + Lite and Lite trust stages")
          PY

  core-has-no-optional-dependency:
    name: CORE imports with nothing installed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The doctrine sentence, checked rather than asserted: Nexus must be
      # useful as CORE with no external Knowledge, no Deception, no remote
      # cognition and no cloud connectivity. A third-party import that crept
      # into the deterministic path would fail here, on a runner where nothing
      # but the standard library is available.
      - name: Import the CORE modules with no dependencies installed
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import pathlib
          import sys
          before = set(sys.modules)
          import azazel_nexus.capability  # noqa: F401
          import azazel_nexus.resource_profile  # noqa: F401
          import azazel_nexus.lite_cache  # noqa: F401
          # The Knowledge Lite trust chain (#6). Verification, content
          # addressing, generations and revocation are what decide whether a
          # cache may be served at all, so they have to import on a node that
          # has nothing installed -- otherwise the one node that most needs to
          # refuse an artifact would be the one unable to check it. A pure
          # standard-library Ed25519 verifier is why this holds; a library
          # dependency here would fail in this job.
          import azazel_nexus.signature as signature  # noqa: F401
          import azazel_nexus.content_store  # noqa: F401
          import azazel_nexus.lite_generation  # noqa: F401
          import azazel_nexus.revocation  # noqa: F401
          import azazel_nexus.lite_trust  # noqa: F401
          # And the service that answers "can this node use its cache now".
          # An operator asks that question on the node that has nothing, so
          # this is the configuration it has to be answerable in.
          import azazel_nexus.lite_service as lite_service  # noqa: F401
          empty = lite_service.KnowledgeLite(
              root=pathlib.Path("/nonexistent-nexus-lite"),
              commissioning_digest="sha256:" + "0" * 64,
          ).read(as_of="1970-01-01T00:00:00Z")
          if empty.state is not lite_service.LiteState.UNAVAILABLE:
              raise SystemExit(
                  "a node with no Knowledge Lite cache must read as unavailable, "
                  f"got {empty.state!r}"
              )
          if empty.blocks_core():
              raise SystemExit("an absent Knowledge Lite cache blocks CORE")
          # The Core reserve (#68). It gates whether a local model provider is
          # admitted, so the node that has nothing is the node that has to be
          # able to read -- and to not find -- its own reserve. `None` here is
          # the answer on every node this build runs on, and the resource gate
          # refuses because of it.
          import azazel_nexus.core_reserve as core_reserve  # noqa: F401
          if core_reserve.load_reserve() is not None:
              raise SystemExit(
                  "a node with nothing installed produced a Core reserve; no "
                  "measurement has been taken (docs/hardware-gates.md HG-05)"
              )
          # The cognition ceiling (#82). An uncommissioned node with nothing
          # installed is exactly the node an operator asks "what may this
          # consult", and the answer has to be available there. `CORE` with no
          # consent is that answer, and no profile written anywhere changes it.
          import azazel_nexus.mio_profile as mio_profile  # noqa: F401
          if mio_profile.profile_in_force(
              commissioned=False, selected=mio_profile.MioProfile.FASTEST_PERMITTED
          ) is not mio_profile.MioProfile.CORE:
              raise SystemExit(
                  "an uncommissioned node adopted a profile it was never "
                  "commissioned for; being written down is not a grant"
              )
          if mio_profile.remote_reachable(mio_profile.MioProfile.CORE):
              raise SystemExit("a CORE node can reach a remote cognition route")
          if mio_profile.NO_OPT_IN.active():
              raise SystemExit("remote is permitted with no opt-in; absence is not consent")
          unmeasured = mio_profile.recommend_profile(
              opt_in=mio_profile.NO_OPT_IN, reserve_measured=False
          )
          if unmeasured.profile is not mio_profile.MioProfile.CORE:
              raise SystemExit(
                  "with the Core reserve unmeasured the recommendation was "
                  f"{unmeasured.profile.value!r}, not core"
              )
          if "COMPLETED" in {d.name for d in mio_profile.InFlightDisposition}:
              raise SystemExit(
                  "a withdrawn remote route can still complete a request; that is "
                  "the one outcome withdrawal exists to prevent"
              )
          # The remote trust plane (#84). The node with nothing installed is
          # the one that must answer "no, and here is which condition is
          # missing" without being able to talk to anything. All four signals
          # are not-checked here, which is not a failure and not a pass.
          import azazel_nexus.remote_trust as remote_trust  # noqa: F401
          from azazel_nexus.edge_package import Evidence
          from azazel_nexus.sanitizer import NEVER_REMOTE, PrivacyClass as _PC
          unchecked = remote_trust.unchecked_reading()
          if unchecked.established:
              raise SystemExit("a node that checked nothing reports remote trust established")
          if remote_trust.ENDPOINT_ALLOWLIST != ():
              raise SystemExit(
                  f"the endpoint allowlist is {remote_trust.ENDPOINT_ALLOWLIST!r}; "
                  "this build admits no provider to name one"
              )
          # And the class refusal survives every other condition being met --
          # the third independent refusal, checked here where nothing else is.
          from azazel_nexus.mio_profile import PREREQUISITES as _PRE, RemoteOptIn as _OptIn
          _consent = _OptIn(granted=frozenset(_PRE), operator="ci", at="ci")
          _all_passed = remote_trust.RemoteTrustReading(
              signals={s: Evidence.PASSED for s in remote_trust.TrustSignal},
              reasons={s: "ci" for s in remote_trust.TrustSignal},
          )
          for _class in NEVER_REMOTE:
              _outcome = remote_trust.remote_admission(
                  profile=mio_profile.MioProfile.FASTEST_PERMITTED,
                  opt_in=_consent,
                  trust=_all_passed,
                  privacy_class=_class,
                  sanitised=True,
              )
              if _outcome.permitted or _outcome.excluded_by is not remote_trust.Exclusion.PRIVACY_CLASS:
                  raise SystemExit(
                      f"{_class.value} reached a remote route with every other "
                      f"condition met; excluded_by={_outcome.excluded_by}"
                  )
          # Route evidence (#83). The node with nothing installed has observed
          # nothing, so nothing is predictable and no candidate can be called
          # fastest. That is the state this job exists to check, and it is the
          # state every node in this build is in.
          import azazel_nexus.route_evidence as route_evidence  # noqa: F401
          _nothing = route_evidence.predict([], candidate="local", as_of="1970-01-01T00:00:00Z")
          if _nothing.predictable:
              raise SystemExit("a candidate with no observations was called predictable")
          if _nothing.meets(deadline_ms=10 ** 9):
              raise SystemExit(
                  "a candidate nobody measured met a deadline; an unmeasured "
                  "route must not be offered as fast"
              )
          if _nothing.p95_ms is not None:
              raise SystemExit(f"an unmeasured candidate reported a p95 of {_nothing.p95_ms}")
          # And the record carries no request. A field added here later has to
          # be argued for rather than appearing.
          if set(route_evidence.OBSERVATION_FIELDS) & {
              "correlation_id", "body", "prompt", "evidence", "source", "identifier"
          }:
              raise SystemExit(
                  "an observation records something about the request; a timing "
                  "record that grew a request field is a request log"
              )
          # Route selection (#81). On a node with nothing installed nothing is
          # permitted but the deterministic handoff, nothing is predictable,
          # and no candidate is called fastest. Every candidate still appears
          # with a reason, because an operator who cannot see why a route was
          # not used cannot act on it.
          import azazel_nexus.route_selection as route_selection  # noqa: F401
          from azazel_nexus.routing import Route as _Route
          _decision = route_selection.select(
              profile=mio_profile.MioProfile.CORE,
              privacy_class=_PC.P0_PUBLIC,
              remote=remote_trust.remote_admission(
                  profile=mio_profile.MioProfile.CORE,
                  opt_in=mio_profile.NO_OPT_IN,
                  trust=remote_trust.unchecked_reading(),
                  privacy_class=_PC.P0_PUBLIC,
                  sanitised=False,
              ),
              local_admitted=False,
              local_refusal="the Core reserve is unmeasured (HG-05)",
              predictions={},
              deadline_ms=1000,
          )
          if _decision.route is not _Route.DETERMINISTIC_HANDOFF:
              raise SystemExit(f"a node with nothing chose {_decision.route.value!r}")
          if tuple(_decision.permitted) != (_Route.DETERMINISTIC_HANDOFF,):
              raise SystemExit(
                  f"a node with nothing permitted {[r.value for r in _decision.permitted]}"
              )
          if not all(str(r.reason).strip() for r in _decision.candidates):
              raise SystemExit("a candidate was excluded with no reason")
          if "COMPLETED" in {o.name for o in route_selection.RequestOutcome}:
              raise SystemExit(
                  "a cancelled, failed, timed-out or withdrawn route can be "
                  "reported as completed"
              )
          for _event in route_selection.NEVER_ANSWERED:
              for _available in (True, False):
                  if route_selection.outcome_for(
                      _event, fallback_available=_available
                  ) is route_selection.RequestOutcome.ANSWERED:
                      raise SystemExit(f"{_event.value} reported the route as answering")
          if route_selection.MAX_FALLBACKS != 1:
              raise SystemExit("more than one fallback is permitted per request")
          # The cognition plane (#5). A node with nothing installed and no
          # provider is the configuration M.I.O. has to be answerable in, and
          # it is the one where `CORE ONLY` is the correct answer rather than
          # a fault.
          import azazel_nexus.compatibility as compatibility  # noqa: F401
          import azazel_nexus.cognition as cognition  # noqa: F401
          # `host=None` rather than invented host facts: a runner has not been
          # commissioned, and that is the state the reading has to handle.
          nothing = cognition.read_cognition(
              [],
              profile=azazel_nexus.resource_profile.ResourceProfile.CORE,
              tested=compatibility.TestedTupleSet(),
              host=None,
          )
          if nothing.state is not cognition.CognitionState.CORE_ONLY:
              raise SystemExit(f"a node with no provider must be CORE ONLY, got {nothing.state!r}")
          if nothing.remote is not cognition.RemoteState.DISABLED:
              raise SystemExit("remote assistance must read disabled, not unavailable")
          if nothing.blocks_deterministic_path():
              raise SystemExit("the cognition plane blocks the deterministic path")
          # The sanitizer (#5). It is the egress boundary, so the one thing to
          # check here is that with nothing installed it still denies -- and
          # that a denial carries no frame at all, rather than an empty one a
          # caller could send.
          import azazel_nexus.sanitizer as sanitizer  # noqa: F401
          policy = sanitizer.SanitizerPolicy.from_mapping(
              {
                  "version": "ci",
                  "remote_default": "deny",
                  "classes": {"P1-sanitized": {"remote": "allow", "fields": ["event_class"]}},
                  "limits": {"max_bytes": 1024},
              }
          )
          denied = sanitizer.sanitize(
              {"event_class": "scan"},
              privacy_class=sanitizer.PrivacyClass.P3_RESTRICTED,
              policy=policy,
              mission="ci",
              alias_key=b"0" * 32,
          )
          if denied.allowed or denied.frame is not None:
              raise SystemExit("a restricted frame must produce zero remote egress")
          # Route selection (#5). On a node with nothing installed and no
          # provider, the deterministic handoff is the answer -- and a
          # fallback from it cannot widen, which is the invariant that has to
          # hold in the configuration with the least to fall back to.
          import azazel_nexus.routing as routing  # noqa: F401
          decision = routing.select_route(
              envelope=routing.RequestEnvelope(
                  correlation_id="ci",
                  privacy_class=sanitizer.PrivacyClass.P1_SANITIZED,
                  deadline="2099-01-01T00:00:00Z",
                  expiry="2099-01-01T00:00:00Z",
              ),
              admissions=[],
              remote_enabled=False,
              now="2026-01-01T00:00:00Z",
              budgets=routing.Budgets(
                  max_request_bytes=1,
                  max_response_bytes=1,
                  requests_per_hour=1,
                  deadline_seconds=1,
                  max_concurrency=1,
              ),
          )
          if decision.route is not routing.Route.DETERMINISTIC_HANDOFF:
              raise SystemExit(f"a node with no provider must answer deterministically, got {decision.route!r}")
          for trigger in routing.FallbackTrigger:
              landed = routing.fallback_for(trigger, from_route=routing.Route.DETERMINISTIC_HANDOFF)
              if landed.ceiling is not routing.Route.DETERMINISTIC_HANDOFF:
                  raise SystemExit(f"{trigger.value} widened the route on a node with nothing")
          # Deception Lite (#54). The decoy is the only internal feature that
          # can be reached from outside, so the check here is that on a node
          # with nothing it is disabled -- and that redirect is not eligible,
          # which must hold in every state and not only the configured ones.
          import azazel_nexus.decoy as decoy  # noqa: F401
          resting = decoy.evaluate(
              "any",
              catalogue=None,
              commissioning=None,
              isolation=decoy.IsolationCheck(passed=None),
          )
          if resting.state is not decoy.DecoyState.DISABLED:
              raise SystemExit(f"a node with no catalogue must be disabled, got {resting.state!r}")
          if resting.exposed or resting.redirect_eligible:
              raise SystemExit("a disabled decoy must be neither exposed nor redirect-eligible")
          if resting.blocks_deterministic_path():
              raise SystemExit("a disabled decoy blocks the deterministic path")
          # The integration view (#55). The claim that has to hold on a node
          # with nothing installed is the one about what it does *not* claim.
          import azazel_nexus.integration as integration  # noqa: F401
          view = integration.build_view(
              capability=azazel_nexus.capability.CapabilityState.CORE,
              knowledge=None,
              cognition=nothing,
              decoy=resting,
              edge=integration.EdgePresence.ABSENT,
          )
          if view.enforcement_capable or view.baseline_ready:
              raise SystemExit("a node with no Edge claimed enforcement or baseline readiness")
          if "Edge deterministic decisions" in view.continues:
              raise SystemExit("a node with no Edge claimed Edge decisions continue")
          if {row.axis for row in view.rows} != set(integration.AXES):
              raise SystemExit("the integration view is missing an axis")
          if not view.defects:
              raise SystemExit("an absent embedded feature must be reported as a defect")
          # And what each embedded feature claims must match what this node
          # can actually do (Nexus#67/#68/#69).
          import azazel_nexus.functional_readiness as readiness  # noqa: F401
          # The review tripwire, narrowed rather than removed. This check
          # used to fail on *any* functional feature, and it did exactly that
          # when Knowledge Lite crossed the line -- which is how the status
          # rows and docs/integration-display.md came to be updated with it.
          # Naming the feature that went through that review keeps the cost
          # for the next one: M.I.O. or Deception Lite becoming functional
          # fails here until the same review happens. Deleting the check
          # instead would have spent the tripwire on its first use.
          reviewed = {"knowledge_lite"}
          declared = {n for n, e in readiness.READINESS.items() if e.functional}
          if declared - reviewed:
              raise SystemExit(
                  f"{sorted(declared - reviewed)} newly declared functional; the "
                  "status rows and docs/integration-display.md have to be "
                  "updated with it"
              )
          if reviewed - declared:
              raise SystemExit(
                  f"{sorted(reviewed - declared)} was reviewed as functional and "
                  "no longer declares it; this list is describing the past"
              )
          # Two words, not one. Deception Lite's functional layer exists and
          # reaches only this host (Nexus#69), so it reports `loopback-only`;
          # M.I.O. has no functional layer and reports `control-plane-only`.
          if readiness.CONTROL_PLANE_ONLY == readiness.LOOPBACK_ONLY:
              raise SystemExit("the two unsupplied words collapsed into one")
          deception = readiness.readiness_for("deception_lite")
          if deception.value != readiness.LOOPBACK_ONLY or not deception.loopback_only:
              raise SystemExit(
                  "Deception Lite is no longer declared loopback-only; if its "
                  "reach changed, docs/deception-lite.md and the status rows "
                  "have to be updated with it"
              )
          # Every feature checked against its own declaration, on the row that
          # actually carries it. A feature with no row here is a feature whose
          # display nothing checks, so an added one fails until it has one.
          rows = {
              "knowledge_lite": ("freshness", "knowledge_lite"),
              "deception_lite": ("freshness", "deception_lite"),
              "mio": ("cognition_route", "mio"),
          }
          if set(rows) != set(readiness.READINESS):
              raise SystemExit(
                  f"{sorted(set(rows) ^ set(readiness.READINESS))} has no row in "
                  "this check; an embedded feature whose display is unchecked "
                  "can claim anything"
              )
          # A second view, identical but for the Knowledge argument. The one
          # above passes `knowledge=None` to check that an absent embedded
          # feature is a defect, and `missing` is the right answer there. It
          # is the wrong configuration for asking what a *present* feature
          # reports, so the reading the Lite service actually returned on this
          # node is fed back in and the feature rows are read from that.
          present = integration.build_view(
              capability=azazel_nexus.capability.CapabilityState.CORE,
              knowledge=empty,
              cognition=nothing,
              decoy=resting,
              edge=integration.EdgePresence.ABSENT,
          )
          for name, entry in sorted(readiness.READINESS.items()):
              row = present.row(*rows[name])
              if entry.functional:
                  # `functional` is the one word that can grow claims, so the
                  # limits are required to exist and required to survive into
                  # the sentence an operator reads. A limit declared and then
                  # dropped from the reason is a limit nobody is ever told.
                  if not entry.means.strip():
                      raise SystemExit(f"{name} is functional and does not say what that means")
                  if not entry.does_not_mean:
                      raise SystemExit(f"{name} is functional and declares no limits")
                  reason = entry.reason()
                  for limit in entry.does_not_mean:
                      if limit not in reason:
                          raise SystemExit(
                              f"{name} declares a limit its reason drops: {limit!r}"
                          )
                  # A functional feature reports what it holds, not one of the
                  # two words that mean "cannot supply".
                  if row.value in (readiness.CONTROL_PLANE_ONLY, readiness.LOOPBACK_ONLY):
                      raise SystemExit(
                          f"{name} is functional and its row still reports {row.value!r}"
                      )
                  # And functional is not supplying. This node has no bundle
                  # and no cache, so `unavailable` is the whole of what it
                  # can honestly say -- the same word the Lite reader returned
                  # near the top of this job.
                  if row.value != lite_service.LiteState.UNAVAILABLE.value:
                      raise SystemExit(
                          f"{name} is functional and reports {row.value!r} on a "
                          "node that has no content at all"
                      )
              else:
                  if entry.value not in (readiness.CONTROL_PLANE_ONLY, readiness.LOOPBACK_ONLY):
                      raise SystemExit(f"{name} reports an unknown word {entry.value!r}")
                  if entry.value not in row.value:
                      raise SystemExit(
                          f"the {name} row reports {row.value!r} and the "
                          f"declaration says {entry.value!r}"
                      )
          # No row anywhere claims a capability is being supplied. A node with
          # nothing installed and nothing imported is the one configuration
          # where that has to hold for every axis at once.
          supplied = sorted(
              r.subject
              for v in (view, present)
              for r in v.rows
              if r.value == "available"
          )
          if supplied:
              raise SystemExit(f"{supplied} reported a capability nothing on this node supplies")
          # Being functional is not being a supplier, and the supplier axis is
          # where the two are most easily confused. Both embedded features
          # report `none` here: one because it cannot supply at all, the other
          # because it is functional and has nothing to serve.
          for axis, subject in (("deception_supplier", "deception"), ("knowledge_supplier", "knowledge")):
              for v in (view, present):
                  if v.row(axis, subject).value != "none":
                      raise SystemExit(f"{subject} was reported as a supplier on a node with nothing")
          # And it must really verify here, not merely import. RFC 8032 §7.1
          # vector 2, inline: an import that succeeded while the arithmetic
          # silently needed something unavailable would pass this job.
          if not signature.verify_detached(
              public_key=bytes.fromhex(
                  "3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c"
              ),
              message=bytes.fromhex("72"),
              signature=bytes.fromhex(
                  "92a009a9f0d4cab8720e820b5f642540a2b27b5416503f8fb3762223ebdb69da"
                  "085ac1e43e15996e458f3613d0f11d8c387b2eaeb4302aeeb00d291612bb0c00"
              ),
          ):
              raise SystemExit(
                  "the Ed25519 verifier does not verify a known-good signature "
                  "on a runner with nothing installed"
              )
          # The activation controller and the layout it installs. These are
          # the CORE path at its most literal: the controller is what runs on
          # a node that has just been installed and has nothing else. If it
          # ever needed an extra to import, a node would be unable to decide
          # what it may run at exactly the moment nothing is installed.
          import azazel_nexus.activation  # noqa: F401
          import azazel_nexus.layout  # noqa: F401
          # The operator's own path. `azazel-nexus status` exists to explain a
          # node that has nothing -- no connectivity, no optional extra, no
          # commissioning. A status command that needed an extra installed
          # would be unavailable exactly when it is the only thing to run.
          import azazel_nexus.operator  # noqa: F401
          import azazel_nexus.wizard  # noqa: F401
          import azazel_nexus.cli as cli  # noqa: F401
          # The degradation matrix. It describes what a node keeps when every
          # optional component is gone, so the job with nothing installed is
          # the one configuration it must import on.
          import azazel_nexus.degradation as degradation  # noqa: F401
          if not all(row[3] for row in degradation.MATRIX):
              raise SystemExit(
                  "a degradation cell reports the deterministic path broken"
              )
          # And the privileged layer must be absent here. This job installs
          # nothing, so if `azazel_nexus_runtime` imported it would mean the
          # library had pulled it in -- which is the one-way dependency
          # failing in the only configuration that can show it.
          try:
              import azazel_nexus_runtime  # noqa: F401
          except ImportError:
              pass
          else:
              raise SystemExit(
                  "azazel_nexus_runtime is importable in the job that installs "
                  "nothing; the library reached the privileged layer"
              )
          # The boundary module too. It names azazel_fabric and must still
          # import here: its Fabric import is deferred to call time precisely
          # so that a missing optional extra is a bounded condition and not
          # the crash the boundary exists to prevent (ADR-0001).
          import azazel_nexus.fabric_boundary as boundary  # noqa: F401
          # The status module too. It exists to be answerable on a node
          # with no connectivity (docs/support-matrix.md 4.1), so the job
          # that proves CORE needs nothing installed is the job that has to
          # import it. A guard that never runs on the configuration it was
          # written for is not a guard.
          import azazel_nexus.status as status  # noqa: F401
          projection = boundary.project_capability(
              azazel_nexus.capability.CapabilityState.CORE,
              azazel_nexus.capability.CORE_CAPABILITIES,
          )
          if projection.available or not projection.reason:
              raise SystemExit(
                  "with no Fabric installed the projection must be unavailable "
                  f"and say why, got available={projection.available!r} "
                  f"reason={projection.reason!r}"
              )
          # The tested-tuple adapter (ADR-0006) answers the same way: with no
          # Fabric, a comparison is unavailable and says why, never an error.
          conformance = boundary.check_tested_tuple(None, {})
          if conformance.conforms or "not installed" not in conformance.reason:
              raise SystemExit(
                  "with no Fabric installed the tuple comparison must be "
                  f"unavailable and say why, got {conformance!r}"
              )
          claims = status.collect_status()
          if not claims:
              raise SystemExit("collect_status returned nothing with no Fabric installed")
          if not any(
              c.verification_state is status.VerificationState.UNAVAILABLE
              for c in claims
          ):
              raise SystemExit(
                  "with no Fabric installed, no claim reported it unavailable; "
                  f"got {[c.verification_state.value for c in claims]}"
              )
          # The model catalog (#94). It has to answer on a node with nothing
          # installed, because the distinction it carries -- "nothing is
          # offered" against "we were told nothing" -- is what an operator
          # reads before any provider exists. Its Ed25519 verification is the
          # standard-library one in `signature.py`, so a PyNaCl import
          # creeping into it would be caught by the scan below.
          import tempfile
          import azazel_nexus.model_catalog as model_catalog
          states = {s.value for s in model_catalog.CatalogState}
          if states != {"absent", "empty", "declared", "present"}:
              raise SystemExit(f"the four catalog states are not four: {sorted(states)}")
          if "AVAILABLE" in {s.name for s in model_catalog.CatalogState}:
              raise SystemExit(
                  "CatalogState gained an AVAILABLE member; the four states "
                  "exist so that no single word stands for all of them"
              )
          if model_catalog.absent_reading().state is not model_catalog.CatalogState.ABSENT:
              raise SystemExit("a node with no catalog does not report absent")
          # Declared and present are two states, not one, on a bare node.
          with tempfile.TemporaryDirectory() as room:
              root = pathlib.Path(room)
              body = b"weights, not a program"
              entry = model_catalog.ModelEntry(
                  model_id="ci-probe",
                  format="gguf",
                  digest="sha256:" + hashlib.sha256(body).hexdigest(),
                  size_bytes=len(body),
                  provenance="ci probe",
                  license_acknowledgement_required=False,
                  runtime_abi="llama.cpp/1",
                  purpose="prove declared and present stay apart",
                  context_limit=4096,
                  declared_min_ram_mib=4096,
                  declared_min_disk_mib=2048,
                  declared_profile=azazel_nexus.resource_profile.ResourceProfile.LITE,
                  rollback_lineage=(),
              )
              declared = model_catalog.verify_artifact(entry, artifact_root=root)
              if declared.state is not model_catalog.CatalogState.DECLARED:
                  raise SystemExit(
                      f"a declared entry with no artifact reports {declared.state.value!r}"
                  )
              if declared.refused_by is not model_catalog.Refusal.ARTIFACT_ABSENT:
                  raise SystemExit("a missing artifact was not refused as absent")
              (root / model_catalog.artifact_filename(entry)).write_bytes(body)
              present = model_catalog.verify_artifact(entry, artifact_root=root)
              if present.state is not model_catalog.CatalogState.PRESENT:
                  raise SystemExit(
                      f"a verified artifact reports {present.state.value!r}, not present"
                  )
              if present.admitted:
                  raise SystemExit(
                      "a verified artifact reported itself admitted; admission is "
                      "decided against a measured Core reserve (HG-05), not here"
                  )
          # The import path (#95). It runs on a node with no network by
          # definition, so the job that installs nothing is the job that has
          # to import it -- and the scan below is what proves the module
          # brought in no unpacker on the way.
          import azazel_nexus.model_import as model_import
          if model_import.MAX_ARTIFACT_BYTES <= 0 or model_import.MIN_FREE_HEADROOM_BYTES <= 0:
              raise SystemExit("the import ceilings are not ceilings")
          with tempfile.TemporaryDirectory() as room:
              node_root = pathlib.Path(room) / "node"
              (node_root / "inbox").mkdir(parents=True)
              commissioned = model_import.CommissionedModels(
                  root=node_root, trusted_keys={}, commissioning_digest="sha256:" + "0" * 64
              )
              service = model_import.ModelImport(commissioned)
              # No catalog at all: absent, and distinct from every other answer.
              if service.reading_for("anything").state is not model_catalog.CatalogState.ABSENT:
                  raise SystemExit("a node with no catalog does not read as absent")
              if service.current_generation() is not None:
                  raise SystemExit("a node that has imported nothing reports a generation")
              if service.list_inbox() != ():
                  raise SystemExit("an empty inbox listed something")
              # An id no listing produced is a refusal, not a path to try.
              refused = service.import_entry(
                  "f" * 64, "anything", now="1970-01-01T00:00:00Z", actor="ci"
              )
              if refused.refused_by is not model_import.ImportRefusal.NOT_IN_INBOX:
                  raise SystemExit(
                      f"an unlisted id was refused as {refused.refused_by!r}"
                  )
              if refused.transition is not None or refused.reading.admitted:
                  raise SystemExit("a refused import reported a transition or an admission")
              # A rollback with no predecessor is refused, never invented.
              try:
                  service.rollback(reason="ci", actor="ci", now="1970-01-01T00:00:00Z")
              except model_import.ImportRefused:
                  pass
              else:
                  raise SystemExit("a rollback invented a predecessor")
          # The operator screen (#99). It is the screen consulted on a node
          # with nothing installed and no connectivity, so the job that
          # installs nothing is the job that has to build it -- and the scan
          # below is what proves it brought in no way to read or write.
          import azazel_nexus.operator_view as operator_view
          transitions = {
              operator_view.TRANSITION_FOR[c] for c in operator_view.Confirmation
          }
          if len(transitions) != len(operator_view.Confirmation):
              raise SystemExit("two confirmations write one audit event")
          catalog_words = {s.value for s in model_catalog.CatalogState}
          provider_words = {s.value for s in operator_view.ProviderState}
          if catalog_words & provider_words:
              raise SystemExit(
                  f"catalog and provider vocabularies share {catalog_words & provider_words}"
              )
          bare_facts = operator_view.ViewFacts(
              profile=mio_profile.MioProfile.FASTEST_PERMITTED,
              opt_in=mio_profile.NO_OPT_IN,
              reserve_measured=False,
              resources=operator_view.NodeResources(16384, 512000, 400000),
              catalog_state=model_catalog.CatalogState.PRESENT,
              readings=(),
              inbox=(),
              quarantined=0,
              installed={},
              rollback_target=None,
          )
          screen = operator_view.build_view(bare_facts)
          admission = screen.operation(operator_view.Confirmation.PROVIDER_ADMISSION)
          if admission.available:
              raise SystemExit(
                  "fastest-permitted offered a provider admission with no "
                  "measured Core reserve"
              )
          if "HG-05" not in admission.reason:
              raise SystemExit("the admission refusal does not name HG-05")
          if screen.status_sentence != operator_view.STATUS_SENTENCE:
              raise SystemExit("the M.I.O. sentence moved")
          if "functional" in screen.status_sentence:
              raise SystemExit("the M.I.O. sentence reads functional")
          if len(screen.operations) != len(operator_view.Confirmation):
              raise SystemExit("an operation was dropped rather than shown unavailable")
          for operation in screen.operations:
              if not operation.reason.strip():
                  raise SystemExit(
                      f"{operation.confirmation.value} is shown without a reason"
                  )
          # Online acquisition (#96). The path a node without connectivity
          # must not have, checked on the job that has no connectivity.
          import azazel_nexus.model_acquisition as model_acquisition
          if len(operator_view.Confirmation) != 6:
              raise SystemExit(
                  "the confirmations changed count; a consent was added or "
                  "folded rather than given its own member"
              )
          if operator_view.Confirmation.MODEL_ACQUISITION is (
              operator_view.Confirmation.MODEL_IMPORT
          ):
              raise SystemExit("acquisition is the import confirmation renamed")
          for symbol in model_acquisition.KNOWN_SOURCES:
              for character in "./:@?#":
                  if character in symbol:
                      raise SystemExit(
                          f"{symbol!r} is spelled like a location, not a symbol"
                      )
          # A catalog cannot introduce a source this build does not know.
          try:
              model_catalog.ModelEntry(
                  model_id="ci-probe", format="gguf",
                  digest="sha256:" + "0" * 64, size_bytes=1,
                  provenance="ci", license_acknowledgement_required=False,
                  runtime_abi="llama.cpp/1", purpose="probe", context_limit=1,
                  declared_min_ram_mib=1, declared_min_disk_mib=1,
                  declared_profile=azazel_nexus.resource_profile.ResourceProfile.LITE,
                  rollback_lineage=(), source_id="https://elsewhere.invalid/x",
              )
          except model_catalog.CatalogRefused:
              pass
          else:
              raise SystemExit("a catalog spelled a location into a source")
          # And an unconfirmed node gets no plan at all.
          offline_only = model_catalog.ModelEntry(
              model_id="ci-probe", format="gguf",
              digest="sha256:" + "0" * 64, size_bytes=1,
              provenance="ci", license_acknowledgement_required=False,
              runtime_abi="llama.cpp/1", purpose="probe", context_limit=1,
              declared_min_ram_mib=1, declared_min_disk_mib=1,
              declared_profile=azazel_nexus.resource_profile.ResourceProfile.LITE,
              rollback_lineage=(), source_id=None,
          )
          try:
              model_acquisition.plan_acquisition(
                  offline_only,
                  consent=model_acquisition.NO_CONSENT,
                  free_bytes=1 << 62,
              )
          except model_acquisition.AcquisitionRefused as refused:
              if refused.cause is not model_acquisition.Refusal.SOURCE_UNAVAILABLE:
                  raise SystemExit(
                      f"an entry with no source was refused as {refused.cause!r}"
                  )
          else:
              raise SystemExit("an entry declaring no source produced a plan")
          # The source registry (#105). The half that resolves a symbol, on
          # the node with nothing installed -- and the two trust policies
          # that must stay two.
          import azazel_nexus.source_registry as source_registry
          if source_registry.REGISTRY_DOMAIN == model_catalog.CATALOG_DOMAIN:
              raise SystemExit(
                  "the registry and the catalog share a signing domain; one "
                  "signature could be read as either"
              )
          shared = b"\x01" * 32
          try:
              source_registry.CommissionedSources(
                  catalog_keys={"one-role": shared},
                  registry_keys={"one-role": shared},
                  commissioning_digest="sha256:" + "0" * 64,
              )
          except source_registry.RegistryRefused:
              pass
          else:
              raise SystemExit(
                  "one key held both the catalog and the registry role; the "
                  "separation those two documents rest on is gone"
              )
          try:
              source_registry.CommissionedSources(
                  catalog_keys={"catalog-role": shared},
                  registry_keys={"registry-role": shared},
                  commissioning_digest="sha256:" + "0" * 64,
              )
          except source_registry.RegistryRefused:
              pass
          else:
              raise SystemExit("two ids for one key were accepted as two keys")
          # A registry record names a source; it names no model.
          record_fields = set(source_registry.SourceRecord.__dataclass_fields__)
          for forbidden in ("model_id", "digest", "size_bytes"):
              if forbidden in record_fields:
                  raise SystemExit(
                      f"a registry record carries {forbidden!r}; its "
                      "administrator could introduce a model"
                  )
          # And a catalog entry names a symbol; it names no location.
          entry_fields = set(model_catalog.ModelEntry.__dataclass_fields__)
          for forbidden in ("host", "port", "url", "endpoint", "path"):
              if forbidden in entry_fields:
                  raise SystemExit(
                      f"a catalog entry carries {forbidden!r}; its signer "
                      "could point this node anywhere"
                  )
          # And no catalog is shipped with the source. A catalog is signed
          # under a commissioning trust policy that only exists on the node;
          # one committed here would be one nobody chose to trust.
          committed = sorted(
              str(p) for p in pathlib.Path(".").rglob(model_catalog.CATALOG_FILENAME)
          )
          if committed:
              raise SystemExit(f"a signed catalog is committed to the repository: {committed}")
          third_party = sorted(
              name.split(".")[0]
              for name in set(sys.modules) - before
              if not name.startswith(("azazel_nexus", "_"))
              and getattr(sys.modules[name], "__file__", "") or ""
          )
          stdlib = set(sys.stdlib_module_names)
          offenders = sorted({n for n in third_party if n not in stdlib})
          if offenders:
              raise SystemExit(f"CORE path imports non-stdlib modules: {offenders}")
          print("CORE path is standard library only")
          PY

  # The product installer refuses every host that is not a reviewed install
  # profile, and the only profile is Debian 13. The installer-executing checks
  # therefore run in a Debian 13 container rather than on ubuntu-latest; the
  # refusal is not weakened for CI.
  installer-debian13:
    name: Installer on Debian 13 (unit + integration)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git ca-certificates \
            coreutils findutils passwd util-linux \
            build-essential python3-dev libffi-dev

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install both distributions into a venv
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/python -m pip install --upgrade pip
          # Non-editable: the staged entrypoint check runs Python -IS and
          # deliberately ignores .pth files, so an editable finder is invisible.
          /opt/venv/bin/python -m pip install '.[dev]'
          /opt/venv/bin/python -m pip install ./runtime

      - name: Run the installer-executing unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 /opt/venv/bin/python -m pytest \
            -p no:cacheprovider -q \
            tests/unit/test_bootstrap_tmpfiles_packaging.py::test_staged_install_copies_rule_without_running_tmpfiles \
            tests/unit/test_e2e_harness.py::test_the_installer_runs_and_creates_the_declared_layout

      # This container runs as root, so create an unprivileged user and run
      # the harness as that user. Without root or a service manager three
      # stages report themselves not executed; the harness refuses to count
      # them as a pass.
      - name: Run the integration harness as a non-root user
        run: |
          useradd -m azci
          chown -R azci:azci "$GITHUB_WORKSPACE"
          install -d -o azci -g azci -m 0700 /tmp/az-e2e-out
          runuser -u azci -- /opt/venv/bin/python -c \
            'import os; assert os.geteuid() != 0, "the integration runner executes as root"'
          cd "$GITHUB_WORKSPACE"
          runuser -u azci -- env PYTHONDONTWRITEBYTECODE=1 sh -c \
            'e2e_root="$(mktemp -d /tmp/az-e2e-out/root.XXXXXX)" && \
             /opt/venv/bin/python tools/e2e.py --root "$e2e_root" --report /tmp/az-e2e-out/report.md'

      - name: Refuse a report whose stages all skipped
        env:
          REPORT_PATH: /tmp/az-e2e-out/report.md
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          import os
          text = pathlib.Path(os.environ["REPORT_PATH"]).read_text()
          print(text)
          match = re.search(r"passed (\d+), not executed (\d+), failed (\d+), of (\d+)", text)
          if not match:
              sys.exit("the report has no summary line")
          passed, skipped, failed, total = (int(g) for g in match.groups())
          if failed:
              sys.exit(f"{failed} stages failed")
          if passed < total - skipped:
              sys.exit("the summary does not add up")
          # A run where almost nothing executed is a run that proved almost
          # nothing. The floor rises with every stage that needs neither root
          # nor a service manager (ten since Nexus#68).
          if passed < 10:
              sys.exit(f"only {passed} of {total} stages executed; expected 10")
          if not re.search(r"^ok\s+CORE \+ Lite configurations\s+\(", text, re.M):
              sys.exit("the CORE + Lite configurations stage did not execute")
          PY

  fabric-extra:
    name: Fabric extra at the pinned tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A pin that nothing installs is a claim, not a dependency. The boundary
      # tests skip themselves when Fabric is absent -- which is correct for a
      # contributor without network access and useless as a gate, so this job
      # is where they are not allowed to skip.
      - name: Install with the Fabric extra
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,fabric]' -e ./runtime

      # Two tests execute packaging/install.sh on the host. The installer
      # deliberately refuses any host that is not a reviewed install profile
      # (Debian 13 only), so they cannot pass on ubuntu-latest. They run in
      # the `installer-debian13` job instead.
      - name: Run unit tests
        run: |
          python -m pytest tests/unit -q \
            --deselect tests/unit/test_bootstrap_tmpfiles_packaging.py::test_staged_install_copies_rule_without_running_tmpfiles \
            --deselect tests/unit/test_e2e_harness.py::test_the_installer_runs_and_creates_the_declared_layout

      # The benchmark harnesses carry their own tests (fixtures, scoring and the
      # contract with the advisory reader). They are not under tests/unit, so
      # without this step a reader change could break them unnoticed, which
      # happened once (bench/mio_local after the 1a guardrails).
      - name: Run benchmark harness tests
        run: python -m pytest bench -q -p no:cacheprovider

      # test_status_claims.py is listed alongside it for the same reason:
      # its check that no document calls a pinned Fabric module unreleased
      # skips without the extra, and a skipped guard reports success.
      # test_commissioning_fabric.py and test_inventory_fabric.py hold the
      # halves of their files that need Fabric; the halves that do not were
      # split off so that a run without the extra still runs them.
      # test_fabric_explanation_projection.py checks the explanation ledger's
      # ClaimSet projection against the pin and skips without the extra.
      - name: Refuse a run where the Fabric-dependent tests skipped
        run: |
          python -m pytest \
            tests/unit/test_fabric_boundary.py \
            tests/unit/test_edge_intake_fabric.py \
            tests/unit/test_edge_loop_status.py \
            tests/unit/test_status_claims.py \
            tests/unit/test_exposure_interfaces.py \
            tests/unit/test_platform_profile.py \
            tests/unit/test_commissioning_fabric.py \
            tests/unit/test_inventory_fabric.py \
            tests/unit/test_fabric_tested_tuple.py \
            tests/unit/test_compatibility.py \
            tests/unit/test_fabric_explanation_projection.py \
            -q --no-header -rs | tee /tmp/boundary.txt
          if grep -qE '[0-9]+ skipped' /tmp/boundary.txt; then
            echo "a Fabric-dependent test skipped on the job that installs Fabric" >&2
            exit 1
          fi

  knowledge-context-candidate:
    name: Knowledge Context against the reviewed Fabric candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The product extra remains pinned to its accepted release tag. This
      # isolated job exercises the Draft contract at one immutable source SHA;
      # it does not change the supported or bundled Nexus dependency pin.
      - name: Install the exact Fabric Draft head
        run: python -m pip install 'azazel-fabric @ git+https://github.com/01rabbit/Azazel-Fabric.git@50494cf769978abdbad21626a130d6525c83135d'

      - name: Install Nexus test/runtime packages
        run: python -m pip install -e '.[dev]' -e ./runtime

      - name: Run the contract/security adapter tests without skips
        run: |
          python -m pytest tests/unit/test_knowledge_context_adapter.py -q -rs | tee /tmp/knowledge-context.txt
          if grep -qE '[0-9]+ skipped' /tmp/knowledge-context.txt; then
            echo "Knowledge Context tests skipped with the exact candidate installed" >&2
            exit 1
          fi
