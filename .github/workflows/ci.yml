name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of what pyproject.toml declares. This is
        # the CI runner's matrix, not a product support claim -- Nexus declares
        # no supported runtime of its own (docs/support-matrix.md §7).
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      # Installed as its own distribution, which is the claim being made: the
      # privileged layer is separable, and the library above was installed
      # without it.
      - name: Install the runtime distribution
        run: python -m pip install -e ./runtime

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  core-has-no-optional-dependency:
    name: CORE imports with nothing installed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The doctrine sentence, checked rather than asserted: Nexus must be
      # useful as CORE with no external Knowledge, no Deception, no remote
      # cognition and no cloud connectivity. A third-party import that crept
      # into the deterministic path would fail here, on a runner where nothing
      # but the standard library is available.
      - name: Import the CORE modules with no dependencies installed
        run: |
          PYTHONPATH=src python - <<'PY'
          import pathlib
          import sys
          before = set(sys.modules)
          import azazel_nexus.capability  # noqa: F401
          import azazel_nexus.resource_profile  # noqa: F401
          import azazel_nexus.lite_cache  # noqa: F401
          # The Knowledge Lite trust chain (#6). Verification, content
          # addressing, generations and revocation are what decide whether a
          # cache may be served at all, so they have to import on a node that
          # has nothing installed -- otherwise the one node that most needs to
          # refuse an artifact would be the one unable to check it. A pure
          # standard-library Ed25519 verifier is why this holds; a library
          # dependency here would fail in this job.
          import azazel_nexus.signature as signature  # noqa: F401
          import azazel_nexus.content_store  # noqa: F401
          import azazel_nexus.lite_generation  # noqa: F401
          import azazel_nexus.revocation  # noqa: F401
          import azazel_nexus.lite_trust  # noqa: F401
          # And the service that answers "can this node use its cache now".
          # An operator asks that question on the node that has nothing, so
          # this is the configuration it has to be answerable in.
          import azazel_nexus.lite_service as lite_service  # noqa: F401
          empty = lite_service.KnowledgeLite(
              root=pathlib.Path("/nonexistent-nexus-lite"),
              commissioning_digest="sha256:" + "0" * 64,
          ).read(as_of="1970-01-01T00:00:00Z")
          if empty.state is not lite_service.LiteState.UNAVAILABLE:
              raise SystemExit(
                  "a node with no Knowledge Lite cache must read as unavailable, "
                  f"got {empty.state!r}"
              )
          if empty.blocks_core():
              raise SystemExit("an absent Knowledge Lite cache blocks CORE")
          # The cognition plane (#5). A node with nothing installed and no
          # provider is the configuration M.I.O. has to be answerable in, and
          # it is the one where `CORE ONLY` is the correct answer rather than
          # a fault.
          import azazel_nexus.compatibility as compatibility  # noqa: F401
          import azazel_nexus.cognition as cognition  # noqa: F401
          # `host=None` rather than invented host facts: a runner has not been
          # commissioned, and that is the state the reading has to handle.
          nothing = cognition.read_cognition(
              [],
              profile=azazel_nexus.resource_profile.ResourceProfile.CORE,
              tested=compatibility.TestedTupleSet(),
              host=None,
          )
          if nothing.state is not cognition.CognitionState.CORE_ONLY:
              raise SystemExit(f"a node with no provider must be CORE ONLY, got {nothing.state!r}")
          if nothing.remote is not cognition.RemoteState.DISABLED:
              raise SystemExit("remote assistance must read disabled, not unavailable")
          if nothing.blocks_deterministic_path():
              raise SystemExit("the cognition plane blocks the deterministic path")
          # The sanitizer (#5). It is the egress boundary, so the one thing to
          # check here is that with nothing installed it still denies -- and
          # that a denial carries no frame at all, rather than an empty one a
          # caller could send.
          import azazel_nexus.sanitizer as sanitizer  # noqa: F401
          policy = sanitizer.SanitizerPolicy.from_mapping(
              {
                  "version": "ci",
                  "remote_default": "deny",
                  "classes": {"P1-sanitized": {"remote": "allow", "fields": ["event_class"]}},
                  "limits": {"max_bytes": 1024},
              }
          )
          denied = sanitizer.sanitize(
              {"event_class": "scan"},
              privacy_class=sanitizer.PrivacyClass.P3_RESTRICTED,
              policy=policy,
              mission="ci",
              alias_key=b"0" * 32,
          )
          if denied.allowed or denied.frame is not None:
              raise SystemExit("a restricted frame must produce zero remote egress")
          # Route selection (#5). On a node with nothing installed and no
          # provider, the deterministic handoff is the answer -- and a
          # fallback from it cannot widen, which is the invariant that has to
          # hold in the configuration with the least to fall back to.
          import azazel_nexus.routing as routing  # noqa: F401
          decision = routing.select_route(
              envelope=routing.RequestEnvelope(
                  correlation_id="ci",
                  privacy_class=sanitizer.PrivacyClass.P1_SANITIZED,
                  deadline="2099-01-01T00:00:00Z",
                  expiry="2099-01-01T00:00:00Z",
              ),
              admissions=[],
              remote_enabled=False,
              now="2026-01-01T00:00:00Z",
              budgets=routing.Budgets(
                  max_request_bytes=1,
                  max_response_bytes=1,
                  requests_per_hour=1,
                  deadline_seconds=1,
                  max_concurrency=1,
              ),
          )
          if decision.route is not routing.Route.DETERMINISTIC_HANDOFF:
              raise SystemExit(f"a node with no provider must answer deterministically, got {decision.route!r}")
          for trigger in routing.FallbackTrigger:
              landed = routing.fallback_for(trigger, from_route=routing.Route.DETERMINISTIC_HANDOFF)
              if landed.ceiling is not routing.Route.DETERMINISTIC_HANDOFF:
                  raise SystemExit(f"{trigger.value} widened the route on a node with nothing")
          # Deception Lite (#54). The decoy is the only internal feature that
          # can be reached from outside, so the check here is that on a node
          # with nothing it is disabled -- and that redirect is not eligible,
          # which must hold in every state and not only the configured ones.
          import azazel_nexus.decoy as decoy  # noqa: F401
          resting = decoy.evaluate(
              "any",
              catalogue=None,
              commissioning=None,
              isolation=decoy.IsolationCheck(passed=None),
          )
          if resting.state is not decoy.DecoyState.DISABLED:
              raise SystemExit(f"a node with no catalogue must be disabled, got {resting.state!r}")
          if resting.exposed or resting.redirect_eligible:
              raise SystemExit("a disabled decoy must be neither exposed nor redirect-eligible")
          if resting.blocks_deterministic_path():
              raise SystemExit("a disabled decoy blocks the deterministic path")
          # The integration view (#55). The claim that has to hold on a node
          # with nothing installed is the one about what it does *not* claim.
          import azazel_nexus.integration as integration  # noqa: F401
          view = integration.build_view(
              capability=azazel_nexus.capability.CapabilityState.CORE,
              knowledge=None,
              cognition=nothing,
              decoy=resting,
              edge=integration.EdgePresence.ABSENT,
          )
          if view.enforcement_capable or view.baseline_ready:
              raise SystemExit("a node with no Edge claimed enforcement or baseline readiness")
          if "Edge deterministic decisions" in view.continues:
              raise SystemExit("a node with no Edge claimed Edge decisions continue")
          if {row.axis for row in view.rows} != set(integration.AXES):
              raise SystemExit("the integration view is missing an axis")
          if not view.defects:
              raise SystemExit("an absent embedded feature must be reported as a defect")
          # And what each embedded feature claims must match what this node
          # can actually do (Nexus#67/#68/#69).
          import azazel_nexus.functional_readiness as readiness  # noqa: F401
          # The review tripwire, narrowed rather than removed. This check
          # used to fail on *any* functional feature, and it did exactly that
          # when Knowledge Lite crossed the line -- which is how the status
          # rows and docs/integration-display.md came to be updated with it.
          # Naming the feature that went through that review keeps the cost
          # for the next one: M.I.O. or Deception Lite becoming functional
          # fails here until the same review happens. Deleting the check
          # instead would have spent the tripwire on its first use.
          reviewed = {"knowledge_lite"}
          declared = {n for n, e in readiness.READINESS.items() if e.functional}
          if declared - reviewed:
              raise SystemExit(
                  f"{sorted(declared - reviewed)} newly declared functional; the "
                  "status rows and docs/integration-display.md have to be "
                  "updated with it"
              )
          if reviewed - declared:
              raise SystemExit(
                  f"{sorted(reviewed - declared)} was reviewed as functional and "
                  "no longer declares it; this list is describing the past"
              )
          # Two words, not one. Deception Lite's functional layer exists and
          # reaches only this host (Nexus#69), so it reports `loopback-only`;
          # M.I.O. has no functional layer and reports `control-plane-only`.
          if readiness.CONTROL_PLANE_ONLY == readiness.LOOPBACK_ONLY:
              raise SystemExit("the two unsupplied words collapsed into one")
          deception = readiness.readiness_for("deception_lite")
          if deception.value != readiness.LOOPBACK_ONLY or not deception.loopback_only:
              raise SystemExit(
                  "Deception Lite is no longer declared loopback-only; if its "
                  "reach changed, docs/deception-lite.md and the status rows "
                  "have to be updated with it"
              )
          # Every feature checked against its own declaration, on the row that
          # actually carries it. A feature with no row here is a feature whose
          # display nothing checks, so an added one fails until it has one.
          rows = {
              "knowledge_lite": ("freshness", "knowledge_lite"),
              "deception_lite": ("freshness", "deception_lite"),
              "mio": ("cognition_route", "mio"),
          }
          if set(rows) != set(readiness.READINESS):
              raise SystemExit(
                  f"{sorted(set(rows) ^ set(readiness.READINESS))} has no row in "
                  "this check; an embedded feature whose display is unchecked "
                  "can claim anything"
              )
          # A second view, identical but for the Knowledge argument. The one
          # above passes `knowledge=None` to check that an absent embedded
          # feature is a defect, and `missing` is the right answer there. It
          # is the wrong configuration for asking what a *present* feature
          # reports, so the reading the Lite service actually returned on this
          # node is fed back in and the feature rows are read from that.
          present = integration.build_view(
              capability=azazel_nexus.capability.CapabilityState.CORE,
              knowledge=empty,
              cognition=nothing,
              decoy=resting,
              edge=integration.EdgePresence.ABSENT,
          )
          for name, entry in sorted(readiness.READINESS.items()):
              row = present.row(*rows[name])
              if entry.functional:
                  # `functional` is the one word that can grow claims, so the
                  # limits are required to exist and required to survive into
                  # the sentence an operator reads. A limit declared and then
                  # dropped from the reason is a limit nobody is ever told.
                  if not entry.means.strip():
                      raise SystemExit(f"{name} is functional and does not say what that means")
                  if not entry.does_not_mean:
                      raise SystemExit(f"{name} is functional and declares no limits")
                  reason = entry.reason()
                  for limit in entry.does_not_mean:
                      if limit not in reason:
                          raise SystemExit(
                              f"{name} declares a limit its reason drops: {limit!r}"
                          )
                  # A functional feature reports what it holds, not one of the
                  # two words that mean "cannot supply".
                  if row.value in (readiness.CONTROL_PLANE_ONLY, readiness.LOOPBACK_ONLY):
                      raise SystemExit(
                          f"{name} is functional and its row still reports {row.value!r}"
                      )
                  # And functional is not supplying. This node has no bundle
                  # and no cache, so `unavailable` is the whole of what it
                  # can honestly say -- the same word the Lite reader returned
                  # near the top of this job.
                  if row.value != lite_service.LiteState.UNAVAILABLE.value:
                      raise SystemExit(
                          f"{name} is functional and reports {row.value!r} on a "
                          "node that has no content at all"
                      )
              else:
                  if entry.value not in (readiness.CONTROL_PLANE_ONLY, readiness.LOOPBACK_ONLY):
                      raise SystemExit(f"{name} reports an unknown word {entry.value!r}")
                  if entry.value not in row.value:
                      raise SystemExit(
                          f"the {name} row reports {row.value!r} and the "
                          f"declaration says {entry.value!r}"
                      )
          # No row anywhere claims a capability is being supplied. A node with
          # nothing installed and nothing imported is the one configuration
          # where that has to hold for every axis at once.
          supplied = sorted(
              r.subject
              for v in (view, present)
              for r in v.rows
              if r.value == "available"
          )
          if supplied:
              raise SystemExit(f"{supplied} reported a capability nothing on this node supplies")
          # Being functional is not being a supplier, and the supplier axis is
          # where the two are most easily confused. Both embedded features
          # report `none` here: one because it cannot supply at all, the other
          # because it is functional and has nothing to serve.
          for axis, subject in (("deception_supplier", "deception"), ("knowledge_supplier", "knowledge")):
              for v in (view, present):
                  if v.row(axis, subject).value != "none":
                      raise SystemExit(f"{subject} was reported as a supplier on a node with nothing")
          # And it must really verify here, not merely import. RFC 8032 §7.1
          # vector 2, inline: an import that succeeded while the arithmetic
          # silently needed something unavailable would pass this job.
          if not signature.verify_detached(
              public_key=bytes.fromhex(
                  "3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c"
              ),
              message=bytes.fromhex("72"),
              signature=bytes.fromhex(
                  "92a009a9f0d4cab8720e820b5f642540a2b27b5416503f8fb3762223ebdb69da"
                  "085ac1e43e15996e458f3613d0f11d8c387b2eaeb4302aeeb00d291612bb0c00"
              ),
          ):
              raise SystemExit(
                  "the Ed25519 verifier does not verify a known-good signature "
                  "on a runner with nothing installed"
              )
          # The activation controller and the layout it installs. These are
          # the CORE path at its most literal: the controller is what runs on
          # a node that has just been installed and has nothing else. If it
          # ever needed an extra to import, a node would be unable to decide
          # what it may run at exactly the moment nothing is installed.
          import azazel_nexus.activation  # noqa: F401
          import azazel_nexus.layout  # noqa: F401
          # The operator's own path. `azazel-nexus status` exists to explain a
          # node that has nothing -- no connectivity, no optional extra, no
          # commissioning. A status command that needed an extra installed
          # would be unavailable exactly when it is the only thing to run.
          import azazel_nexus.operator  # noqa: F401
          import azazel_nexus.wizard  # noqa: F401
          import azazel_nexus.cli as cli  # noqa: F401
          # The degradation matrix. It describes what a node keeps when every
          # optional component is gone, so the job with nothing installed is
          # the one configuration it must import on.
          import azazel_nexus.degradation as degradation  # noqa: F401
          if not all(row[3] for row in degradation.MATRIX):
              raise SystemExit(
                  "a degradation cell reports the deterministic path broken"
              )
          # And the privileged layer must be absent here. This job installs
          # nothing, so if `azazel_nexus_runtime` imported it would mean the
          # library had pulled it in -- which is the one-way dependency
          # failing in the only configuration that can show it.
          try:
              import azazel_nexus_runtime  # noqa: F401
          except ImportError:
              pass
          else:
              raise SystemExit(
                  "azazel_nexus_runtime is importable in the job that installs "
                  "nothing; the library reached the privileged layer"
              )
          # The boundary module too. It names azazel_fabric and must still
          # import here: its Fabric import is deferred to call time precisely
          # so that a missing optional extra is a bounded condition and not
          # the crash the boundary exists to prevent (ADR-0001).
          import azazel_nexus.fabric_boundary as boundary  # noqa: F401
          # The status module too. It exists to be answerable on a node
          # with no connectivity (docs/support-matrix.md 4.1), so the job
          # that proves CORE needs nothing installed is the job that has to
          # import it. A guard that never runs on the configuration it was
          # written for is not a guard.
          import azazel_nexus.status as status  # noqa: F401
          projection = boundary.project_capability(
              azazel_nexus.capability.CapabilityState.CORE,
              azazel_nexus.capability.CORE_CAPABILITIES,
          )
          if projection.available or not projection.reason:
              raise SystemExit(
                  "with no Fabric installed the projection must be unavailable "
                  f"and say why, got available={projection.available!r} "
                  f"reason={projection.reason!r}"
              )
          claims = status.collect_status()
          if not claims:
              raise SystemExit("collect_status returned nothing with no Fabric installed")
          if not any(
              c.verification_state is status.VerificationState.UNAVAILABLE
              for c in claims
          ):
              raise SystemExit(
                  "with no Fabric installed, no claim reported it unavailable; "
                  f"got {[c.verification_state.value for c in claims]}"
              )
          third_party = sorted(
              name.split(".")[0]
              for name in set(sys.modules) - before
              if not name.startswith(("azazel_nexus", "_"))
              and getattr(sys.modules[name], "__file__", "") or ""
          )
          stdlib = set(sys.stdlib_module_names)
          offenders = sorted({n for n in third_party if n not in stdlib})
          if offenders:
              raise SystemExit(f"CORE path imports non-stdlib modules: {offenders}")
          print("CORE path is standard library only")
          PY

  integration:
    name: Install-to-status integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install both distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -e ./runtime

      # This runner is neither root nor running systemd, so three stages
      # report themselves not executed: the accounts, the units being masked,
      # and the inventory that needs a principal the accounts would create.
      # That is the honest outcome and the harness refuses to count any of
      # them as a pass -- `--require-all` is what a host with both would add,
      # and this job deliberately does not.
      #
      # The first version of this job installed as root in a container and so
      # never saw the non-root path. The harness reported five cascading
      # failures for one missing privilege; it now reports one skip and names
      # it as the reason for the rest.
      - name: Run the integration harness
        run: |
          sudo mkdir -p /tmp/az-e2e
          sudo chown "$(id -u):$(id -g)" /tmp/az-e2e
          python tools/e2e.py --root /tmp/az-e2e --report /tmp/az-e2e/report.md

      - name: Refuse a report whose stages all skipped
        run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("/tmp/az-e2e/report.md").read_text()
          print(text)
          match = re.search(r"passed (\d+), not executed (\d+), failed (\d+), of (\d+)", text)
          if not match:
              sys.exit("the report has no summary line")
          passed, skipped, failed, total = (int(g) for g in match.groups())
          if failed:
              sys.exit(f"{failed} stages failed")
          if passed < total - skipped:
              sys.exit("the summary does not add up")
          # A run where nothing executed is a run that proved nothing, and a
          # green job for it would be the worst kind of green.
          # A run where almost nothing executed is a run that proved almost
          # nothing, and a green job for it would be the worst kind of green.
          # Nine is what this runner reaches: everything but the three that
          # need root or a service manager. It was eight until Nexus#56 added
          # the CORE + Lite matrix, which needs neither -- and a floor that
          # does not rise when a universally-runnable stage is added is a
          # floor that has stopped meaning anything.
          if passed < 9:
              sys.exit(f"only {passed} of {total} stages executed; expected 9")
          PY

  fabric-extra:
    name: Fabric extra at the pinned tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A pin that nothing installs is a claim, not a dependency. The boundary
      # tests skip themselves when Fabric is absent -- which is correct for a
      # contributor without network access and useless as a gate, so this job
      # is where they are not allowed to skip.
      - name: Install with the Fabric extra
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,fabric]'

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      # test_status_claims.py is listed alongside it for the same reason:
      # its check that no document calls a pinned Fabric module unreleased
      # skips without the extra, and a skipped guard reports success.
      - name: Refuse a run where the Fabric-dependent tests skipped
        run: |
          python -m pytest \
            tests/unit/test_fabric_boundary.py \
            tests/unit/test_status_claims.py \
            -q --no-header -rs | tee /tmp/boundary.txt
          if grep -qE '[0-9]+ skipped' /tmp/boundary.txt; then
            echo "a Fabric-dependent test skipped on the job that installs Fabric" >&2
            exit 1
          fi
